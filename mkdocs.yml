site_name: ok-script
site_description: "Vibe Coding Automation Framework: make a wish in a coding agent, get a deployable automation app"
repo_url: https://github.com/ok-oldking/ok-script
repo_name: ok-oldking/ok-script
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.tabs.link
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - 简体中文:
      - 首页: index.md
      - 开始 MCP 开发:
          - MCP 快速开始: quick_start/README.md
          - 代理安装指南（英文）: agent-setup.md
          - 编程代理提示词: agent-prompts.md
      - MCP 参考:
          - MCP 连接与执行（英文）: mcp.md
          - 模板导出格式（英文）: feature-crops.md
      - 交付与维护:
          - 维护和分享任务: after_quick_start/README.md
          - 导入插件: plugins.md
          - Windows 计划任务: Windows 计划任务.md
      - 原理与工具:
          - 自动化原理: intro_to_automation/README.md
          - 界面与开发工具: interface.md
          - 运行时架构（英文）: architecture.md
      - 参与贡献:
          - 构建文档网站: building-site.md
  - English:
      - Home: en/index.md
      - Start MCP development:
          - MCP quick start: en/quick_start.md
          - Agent environment setup: agent-setup.md
          - Ask a coding agent: en/agent-prompts.md
      - MCP reference:
          - MCP connection and execution: mcp.md
          - Template export format: feature-crops.md
      - Ship and maintain:
          - Maintain and share tasks: en/advanced.md
          - Imported plugins: en/plugins.md
      - Concepts and tools:
          - How automation works: en/intro_to_automation.md
          - Interface and developer tools: en/interface.md
          - Runtime architecture: architecture.md
      - Contributing:
          - Build the documentation site: en/building-site.md
