site_name: ok-script
site_description: Use MCP and a coding agent to build reusable Python automation
repo_url: https://github.com/ok-oldking/ok-script
repo_name: ok-oldking/ok-script
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - 简体中文:
      - 文档中心: index.md
      - MCP 快速开始: quick_start/README.md
      - 编程代理提示词: agent-prompts.md
      - MCP 连接与执行: mcp.md
      - 自动化原理: intro_to_automation/README.md
      - 界面与开发工具: interface.md
      - 进阶指南: after_quick_start/README.md
      - 导入插件: plugins.md
      - 构建文档网站: building-site.md
  - English:
      - Documentation home: en/index.md
      - MCP quick start: en/quick_start.md
      - Ask a coding agent: en/agent-prompts.md
      - MCP connection and execution: mcp.md
      - How automation works: en/intro_to_automation.md
      - Interface and developer tools: en/interface.md
      - Advanced guide: en/advanced.md
      - Template export format: feature-crops.md
      - Imported plugins: en/plugins.md
      - Build the documentation site: en/building-site.md
